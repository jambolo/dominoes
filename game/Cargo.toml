[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = "4.6"
dominoes-state = { path = "../dominoes-state" }
ego-tree = { version = "0.11", features=["serde"] }
game-player = { workspace = true }
iced = { version = "0.14", features = ["canvas", "image"] }
player = { path = "../player" }
regex = "1.13"
rules = { path = "../rules" }
serde = "1.0"
serde_json = "1.0"

[[bin]]
name = "dominoes"
path = "src/main.rs"
